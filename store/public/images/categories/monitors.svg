<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Monitor casing -->
  <rect x="28" y="22" width="184" height="120" rx="10" fill="#dbeafe" stroke="#2F5597" stroke-width="3"/>
  <!-- Screen -->
  <rect x="40" y="34" width="160" height="96" rx="6" fill="#1e3a6e"/>
  <!-- Screen content — chart/dashboard look -->
  <rect x="50" y="44" width="50" height="36" rx="4" fill="#2F5597" opacity="0.6"/>
  <rect x="110" y="44" width="80" height="16" rx="3" fill="#60a5fa" opacity="0.5"/>
  <rect x="110" y="64" width="60" height="8" rx="3" fill="#93c5fd" opacity="0.4"/>
  <!-- Bar chart -->
  <rect x="54" y="62" width="8" height="14" rx="2" fill="#34d399" opacity="0.9"/>
  <rect x="66" y="56" width="8" height="20" rx="2" fill="#34d399" opacity="0.7"/>
  <rect x="78" y="50" width="8" height="26" rx="2" fill="#34d399" opacity="0.8"/>
  <!-- Bottom rows -->
  <rect x="50" y="90" width="140" height="5" rx="2" fill="#60a5fa" opacity="0.25"/>
  <rect x="50" y="100" width="100" height="5" rx="2" fill="#60a5fa" opacity="0.18"/>
  <!-- Power LED -->
  <circle cx="120" cy="126" r="3" fill="#34d399"/>
  <!-- Stand neck -->
  <rect x="108" y="142" width="24" height="14" rx="4" fill="#93b8e8" stroke="#2F5597" stroke-width="1.5"/>
  <!-- Stand base -->
  <rect x="80" y="154" width="80" height="10" rx="5" fill="#bfdbfe" stroke="#2F5597" stroke-width="2"/>
</svg>
