<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Paper output tray bottom -->
  <rect x="60" y="130" width="120" height="28" rx="4" fill="#e0f2fe" stroke="#2F5597" stroke-width="2"/>
  <!-- Paper sheets in output -->
  <rect x="70" y="126" width="100" height="6" rx="2" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <rect x="70" y="121" width="100" height="6" rx="2" fill="white" stroke="#bfdbfe" stroke-width="1"/>
  <!-- Printer body -->
  <rect x="44" y="68" width="152" height="66" rx="10" fill="#dbeafe" stroke="#2F5597" stroke-width="3"/>
  <!-- Printer top paper slot -->
  <rect x="76" y="62" width="88" height="12" rx="4" fill="#bfdbfe" stroke="#2F5597" stroke-width="2"/>
  <!-- Paper in feed -->
  <rect x="84" y="48" width="72" height="18" rx="3" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
  <!-- Lines on paper -->
  <rect x="92" y="54" width="40" height="2.5" rx="1" fill="#93c5fd" opacity="0.6"/>
  <rect x="92" y="59" width="55" height="2.5" rx="1" fill="#93c5fd" opacity="0.4"/>
  <!-- Printer front panel -->
  <rect x="58" y="90" width="124" height="32" rx="6" fill="#bfdbfe" stroke="#93b8e8" stroke-width="1.5"/>
  <!-- Status indicator LEDs -->
  <circle cx="90" cy="106" r="5" fill="#34d399"/>
  <circle cx="108" cy="106" r="5" fill="#fbbf24" opacity="0.8"/>
  <!-- Control button -->
  <rect x="155" y="100" width="20" height="12" rx="4" fill="#2F5597" opacity="0.7"/>
  <!-- Paper exit slot line -->
  <line x1="60" y1="126" x2="180" y2="126" stroke="#2F5597" stroke-width="2" stroke-dasharray="4 3" opacity="0.4"/>
</svg>
