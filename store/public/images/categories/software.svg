  <rect x="100" y="98" width="40" height="6" rx="2" fill="#34d399" opacity="0.8"/>
  <!-- Line 4 -->
  <rect x="44" y="112" width="10" height="6" rx="2" fill="#f87171"/>
  <rect x="58" y="112" width="60" height="6" rx="2" fill="#f1f5f9" opacity="0.3"/>
  <!-- Line 5 -->
  <rect x="44" y="126" width="30" height="6" rx="2" fill="#60a5fa" opacity="0.5"/>
