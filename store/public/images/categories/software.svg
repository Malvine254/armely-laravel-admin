  <rect x="44" y="70" width="22" height="6" rx="2" fill="#c084fc"/>
  <rect x="70" y="70" width="18" height="6" rx="2" fill="#60a5fa"/>
  <rect x="92" y="70" width="8" height="6" rx="2" fill="#f1f5f9" opacity="0.5"/>
  <rect x="104" y="70" width="36" height="6" rx="2" fill="#34d399"/>
  <!-- Line 2 -->
  <rect x="56" y="84" width="14" height="6" rx="2" fill="#fbbf24"/>
  <rect x="74" y="84" width="28" height="6" rx="2" fill="#f1f5f9" opacity="0.4"/>
  <rect x="106" y="84" width="50" height="6" rx="2" fill="#60a5fa" opacity="0.7"/>
  <!-- Line 3 -->
  <rect x="56" y="98" width="22" height="6" rx="2" fill="#c084fc"/>
