<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Router body -->
  <rect x="36" y="80" width="168" height="52" rx="10" fill="#dbeafe" stroke="#2F5597" stroke-width="3"/>
  <!-- Router front vents -->
  <rect x="52" y="92" width="4" height="28" rx="2" fill="#93b8e8" opacity="0.6"/>
  <rect x="60" y="92" width="4" height="28" rx="2" fill="#93b8e8" opacity="0.6"/>
  <rect x="68" y="92" width="4" height="28" rx="2" fill="#93b8e8" opacity="0.6"/>
  <!-- Status LEDs -->
  <circle cx="106" cy="106" r="4" fill="#34d399"/>
  <circle cx="120" cy="106" r="4" fill="#34d399"/>
  <circle cx="134" cy="106" r="4" fill="#fbbf24"/>
  <circle cx="148" cy="106" r="4" fill="#34d399"/>
  <circle cx="162" cy="106" r="4" fill="#f87171" opacity="0.7"/>
  <!-- Antennas -->
  <line x1="72" y1="80" x2="60" y2="36" stroke="#2F5597" stroke-width="3" stroke-linecap="round"/>
  <line x1="168" y1="80" x2="180" y2="36" stroke="#2F5597" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="34" r="5" fill="#2F5597"/>
  <circle cx="180" cy="34" r="5" fill="#2F5597"/>
  <!-- Wifi signal arcs -->
  <path d="M100 58 Q120 42 140 58" stroke="#60a5fa" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M88 70 Q120 48 152 70" stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <circle cx="120" cy="72" r="4" fill="#2F5597"/>
  <!-- Ethernet ports on back bottom -->
  <rect x="90" y="128" width="12" height="6" rx="1" fill="#2F5597" opacity="0.5"/>
  <rect x="108" y="128" width="12" height="6" rx="1" fill="#2F5597" opacity="0.5"/>
  <rect x="126" y="128" width="12" height="6" rx="1" fill="#2F5597" opacity="0.5"/>
</svg>
