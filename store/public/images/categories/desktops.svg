<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Tower case body -->
  <rect x="76" y="20" width="88" height="144" rx="10" fill="#dbeafe" stroke="#2F5597" stroke-width="3"/>
  <!-- Top stripe -->
  <rect x="76" y="20" width="88" height="18" rx="10" fill="#bfdbfe"/>
  <rect x="76" y="30" width="88" height="8" fill="#bfdbfe"/>
  <!-- Optical drive slot -->
  <rect x="88" y="48" width="64" height="10" rx="3" fill="#93b8e8" stroke="#2F5597" stroke-width="1"/>
  <rect x="108" y="51" width="28" height="4" rx="2" fill="#2F5597" opacity="0.25"/>
  <!-- Second slot -->
  <rect x="88" y="64" width="64" height="10" rx="3" fill="#93b8e8" stroke="#2F5597" stroke-width="1" opacity="0.7"/>
  <!-- Power button -->
  <circle cx="120" cy="92" r="10" fill="#2F5597" opacity="0.15" stroke="#2F5597" stroke-width="2"/>
  <path d="M120 86 L120 92" stroke="#2F5597" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M113.5 88.5 A8 8 0 1 0 126.5 88.5" stroke="#2F5597" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- LED indicators -->
  <circle cx="100" cy="112" r="3.5" fill="#34d399"/>
  <circle cx="112" cy="112" r="3.5" fill="#fbbf24" opacity="0.8"/>
  <!-- USB ports -->
  <rect x="100" y="124" width="14" height="7" rx="2" fill="#2F5597" opacity="0.4"/>
  <rect x="120" y="124" width="14" height="7" rx="2" fill="#2F5597" opacity="0.4"/>
  <!-- Ventilation grill bottom -->
  <rect x="88" y="140" width="64" height="3" rx="1.5" fill="#93b8e8" opacity="0.5"/>
  <rect x="88" y="146" width="64" height="3" rx="1.5" fill="#93b8e8" opacity="0.4"/>
  <rect x="88" y="152" width="64" height="3" rx="1.5" fill="#93b8e8" opacity="0.3"/>
</svg>
